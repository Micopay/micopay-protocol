[package]
name = "micopay-labs-smart-wallet"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "25.3.2"

[dev-dependencies]
soroban-sdk = { version = "25.3.2", features = ["testutils"] }
ed25519-dalek = "2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
