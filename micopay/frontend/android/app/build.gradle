apply plugin: 'com.android.application'

// versionCode a partir de la fecha/hora del build: AAMMDDHH.
// Ejemplo: 26082416 = 2026-08-24, 16h.
//
// Por que asi y no un contador de commits: el contador depende de la rama, y
// compilar desde una rama con menos historial generaria un numero MENOR que el
// ya repartido, lo que impide instalar encima. La fecha siempre crece y es
// independiente de la rama. Ademas identifica el build al dar soporte.
//
// Limite de Android: 2100000000. Este esquema llega a 99123123 en el ano 2099.
// Granularidad de una hora: dos builds en la misma hora comparten numero, lo
// cual es aceptable porque solo importa al repartir, no al compilar.
// Se puede forzar con MICOPAY_VERSION_CODE para reproducir un build concreto.
def computeVersionCode = { ->
    def override = System.getenv('MICOPAY_VERSION_CODE')
    if (override && override.isInteger()) {
        return override.toInteger()
    }
    return new Date().format('yyMMddHH').toInteger()
}

def stellarNetwork = (System.getenv('MICOPAY_STELLAR_NETWORK')
    ?: project.findProperty('micopayStellarNetwork')
    ?: 'TESTNET').toUpperCase()
if (!(stellarNetwork in ['TESTNET', 'PUBLIC'])) {
    throw new GradleException('MICOPAY_STELLAR_NETWORK must be TESTNET or PUBLIC')
}

// Contratos que el firmador nativo acepta para lock, release y decline. Incluye
// las instancias anteriores porque sus operaciones siguen liberandose ahi
// (contracts/TESTNET.md).
def escrowContracts = System.getenv('MICOPAY_ESCROW_CONTRACTS')
    ?: project.findProperty('micopayEscrowContracts')
    ?: (stellarNetwork == 'TESTNET' ? [
        'CALS46FVLSLLPASFHAZVRCSQCUFUSKW64547L6OUDLLPEORKNCXDUDH3',
        'CCX5E4ALJ5J5ZUOW7ZKXYDJ23ZREKDWYR6JR62NBOSTHUQ3LIGKG6GU4',
        'CDUI253FSVVVXUBI4SU3PEQIDNCYWGABGUOCRBIINRCJ4SJ5XVKWYGAX',
        'CBFDXYUPL4Q37JP3JD6JHFG6BQGNG6VOTTGMBTTPE5TYDHOVRY5UNQWE',
        'CB4M5777YFQWKGDUULCX5W6PXEDJSJARDTMH4VV6FXC4W4UPANALO3HZ',
    ].join(',') : null)
if (!escrowContracts) {
    throw new GradleException('MICOPAY_ESCROW_CONTRACTS is required for PUBLIC builds')
}

// Llave publica que firma los retos SEP-10. Vacia, la APK no firma inicios de
// sesion web.
def sep10SigningKey = System.getenv('MICOPAY_SEP10_SIGNING_KEY')
    ?: project.findProperty('micopaySep10SigningKey')
    ?: (stellarNetwork == 'TESTNET' ? 'GDI4RVFVG3O2UVGJDVXIZG3Q2KW5E64LILFMMYENWA25BXLVBK5634RN' : '')

android {
    namespace = "com.micopay.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.micopay.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode computeVersionCode()
        versionName "1.0.0"
        resConfigs "es", "en"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "STELLAR_NETWORK", "\"${stellarNetwork}\""
        buildConfigField "String", "ESCROW_CONTRACTS", "\"${escrowContracts}\""
        buildConfigField "String", "SEP10_SIGNING_KEY", "\"${sep10SigningKey}\""
        buildConfigField "String", "SEP10_HOME_DOMAIN", "\"app.micopay.com.mx\""
        buildConfigField "String", "SEP10_WEB_AUTH_DOMAIN", "\"api.micopay.app\""
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        release {
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(propsFile))
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "network.lightsail:stellar-sdk:4.0.1"
    implementation "network.lightsail:stellar-sdk-android-spi:4.0.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
